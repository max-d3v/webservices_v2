version: '3.8'

services:
  # ===================================
  # 🚀 APLICAÇÃO PRINCIPAL
  # ===================================
  webservices:
    build: 
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: webservices-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=staging
      - PORT=3000
      - LOG_LEVEL=debug
    volumes:
      - ./logs:/app/logs
      - ./quality-metrics:/app/quality-metrics
    networks:
      - webservices-network
    depends_on:
      - mysql
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ===================================
  # 🗄️ BANCO DE DADOS MYSQL
  # ===================================
  mysql:
    image: mysql:8.0
    container_name: webservices-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: webservices
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_pass
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - webservices-network
    restart: unless-stopped

  # ===================================
  # 🔴 CACHE REDIS
  # ===================================
  redis:
    image: redis:7-alpine
    container_name: webservices-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - webservices-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # ===================================
  # 📊 MONITORAMENTO - PROMETHEUS
  # ===================================
  prometheus:
    image: prom/prometheus:latest
    container_name: webservices-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - webservices-network
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'

  # ===================================
  # 📈 DASHBOARDS - GRAFANA
  # ===================================
  grafana:
    image: grafana/grafana:latest
    container_name: webservices-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - webservices-network
    restart: unless-stopped
    depends_on:
      - prometheus

  # ===================================
  # 🔍 QUALIDADE - SONARQUBE
  # ===================================
  sonarqube:
    image: sonarqube:community
    container_name: webservices-sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://postgres:5432/sonar
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - webservices-network
    depends_on:
      - postgres
    restart: unless-stopped

  # ===================================
  # 🐘 POSTGRES PARA SONARQUBE
  # ===================================
  postgres:
    image: postgres:13
    container_name: webservices-postgres
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - webservices-network
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  prometheus_data:
  grafana_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  postgres_data:

networks:
  webservices-network:
    driver: bridge